<body>
<div id="map"></div>
<div id="title">涓浗閲戠熆鍒嗗竷 <b>鍏ㄥ浗鐭夸骇鍦?2 涓? 澶?/b><span id="cnt" style="color:#8fb3dd"></span></div>

  <div class="nd">N</div><div class="sd">S</div><div class="wd">W</div><div class="ed">E</div>

</div>

  <div id="chips"><button id="btn4">鈽?鎶曞杺</button></div>
  <div class="loc" id="locbox">杩樻病瀹氫綅 路 鐐瑰彸涓婅銆屽畾浣嶆垜銆嶏紝娴忚鍣ㄤ細闂綘瑕佹潈闄愶紝鍏佽浜嗘墠鍑?/div>

<script src="leaflet/leaflet.js"></script>
<script src="gold-points.js"></script>

<script>
const map = L.map('map', {zoomControl:false, attributionControl:false, preferCanvas:true}).setView([34.5, 108], 5);

/* 鈹€鈹€ 搴曞浘锛氫富鐢ㄩ珮寰凤紝澶辫触鑷姩鍒囪吘璁紙涓よ€呴兘鏄?GCJ-02锛屽潗鏍囦笉鐢ㄦ敼锛?鈹€鈹€ */
const TILE_MAIN = {
  url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',
  opt:{subdomains:['1','2','3','4'], maxZoom:18, className:'darktile'}
};
const TILE_BAK = {
  url:'https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={y}&type=vector&styleid=3',
  opt:{subdomains:['0','1','2','3'], maxZoom:18, className:'darktile'}
};
let mainLayer = null, bakLayer = null, tileErr = 0, switched = false;

function useMain(){
  if(bakLayer){ map.removeLayer(bakLayer); bakLayer = null; }
  if(mainLayer) map.removeLayer(mainLayer);
  tileErr = 0;
  mainLayer = L.tileLayer(TILE_MAIN.url, TILE_MAIN.opt);
  mainLayer.on('tileerror', function(){
    if(switched) return;
    tileErr++;
    if(tileErr >= 6) useBak();
  });
  mainLayer.addTo(map);
  mainLayer.bringToBack();
}
function useBak(){
  if(switched) return;
  switched = true;
  if(mainLayer){ map.removeLayer(mainLayer); mainLayer = null; }
  bakLayer = L.tileLayer(TILE_BAK.url, TILE_BAK.opt);
  bakLayer.addTo(map);
  bakLayer.bringToBack();
  /* 澶囩敤婧愪篃鎸備簡灏卞啀璇曚富婧愪竴娆?*/
  bakLayer.on('tileerror', function(){
    setTimeout(function(){ switched = false; useMain(); }, 3000);
  });
}
useMain();
map.on('zoomend moveend', function(){
  if(switched) return;
  setTimeout(function(){
    if(!switched && tileErr >= 6) useBak();
  }, 1200);
});

/* 鈹€鈹€ WGS84 鈫?GCJ-02锛堥珮寰峰簳鍥炬槸鐏槦鍧愭爣锛?鈹€鈹€ */
const GCJ_A=6378245.0, GCJ_EE=0.00669342162296594323;
function outOfChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;}
function tLat(x,y){
  let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
  r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  return r;
}
function tLng(x,y){
  let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
  r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  return r;
}
function toGcj(lng,lat){
  if(outOfChina(lng,lat)) return [lng,lat];
  let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  const rad=lat/180*Math.PI; let magic=Math.sin(rad); magic=1-GCJ_EE*magic*magic;
  const sq=Math.sqrt(magic);
  dLat=(dLat*180)/((GCJ_A*(1-GCJ_EE))/(magic*sq)*Math.PI);
  dLng=(dLng*180)/(GCJ_A/sq*Math.cos(rad)*Math.PI);
  return [lng+dLng, lat+dLat];
}

/* 鈹€鈹€ 鏁版嵁锛氬叏鍥界熆浜у湴鍏紑鍚嶅綍锛岄噾/閾?鐮傞噾/閾傜熆鍏?2 涓囦綑澶?鈹€鈹€ */
const D = window.GOLD_DATA;
const SC = D.scales, US = D.uses, NM = D.names;
const KIND_STYLE = {
  '閲戠熆':   {c:'#ffd66b', cls:'k1', label:'宀╅噾'},
  '鐮傞噾':   {c:'#7ee0a8', cls:'k2', label:'鐮傞噾'},
  '閾剁熆':   {c:'#cbd5e1', cls:'k3', label:'閾剁熆'},
  '閾傜熆':   {c:'#a78bfa', cls:'k4', label:'閾傜熆'}
};
function kindStyle(t){
  for(const k in KIND_STYLE) if(t.indexOf(k)>=0) return KIND_STYLE[k];
  return {c:'#94a3b8', cls:'k3', label:'鍏朵粬'};
}
const RAD = [6,5.5,4.5,3.5,2.6,2.2,2,2.4];

const kindsOn = {'宀╅噾':true,'鐮傞噾':true,'閾剁熆':true,'閾傜熆':true,'鍏朵粬':true};

const pts = D.pts.map(p=>{
  const [la,lo,ni,sc,us,kd] = p;
  const name = NM[ni] || '(鏈叿鍚?';
  const st = kindStyle(kd);
  return {lat:la, lng:lo, name, sc, us, kd, st};
});
const total = pts.length;

const renderer = L.canvas({padding:0.3});
const layerAll = L.layerGroup().addTo(map);

/* 鎵嬫満涓婁竴娆℃€х敾涓や竾涓偣浼氬崱姝伙紝鏀规垚銆屽彧鐢诲綋鍓嶈閲庨噷鏈€閲嶈鐨勯偅鎵广€?*/
const MAXPTS = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ? 700 : 3000;
const ptsSorted = pts.slice().sort((a,b)=>(a.sc|0)-(b.sc|0));   // 瑙勬ā澶х殑鎺掑墠闈?
const popup = L.popup({maxWidth:260});
let shownN = 0;

function popHtml(p){
  return `<div class="pop"><h4>${p.name}</h4>
    <div style="color:#8fb3dd;font-size:12px;margin-bottom:5px">
      ${p.kd} 路 ${SC[p.sc]||'鏈爣娉?} 路 ${US[p.us]||'鏈爣娉?}<br>
      绾?${p.lat.toFixed(3)}, ${p.lng.toFixed(3)}锛堢簿搴︾害鐧剧背锛屽叕寮€鍚嶅綍鍧愭爣锛?/div></div>`;
}

function renderVisible(){
  layerAll.clearLayers();
  shownN = 0;
  if(!map.hasLayer(layerAll)) return;
  const b = map.getBounds().pad(0.1);
  const s=b.getSouth(), n=b.getNorth(), w=b.getWest(), e=b.getEast();
  let hit = 0;
  for(let i=0;i<ptsSorted.length;i++){
    const p = ptsSorted[i];
    if(p.lat<s||p.lat>n||p.lng<w||p.lng>e) continue;
    if(!kindsOn[p.st.label]) continue;
    hit++;
    if(shownN >= MAXPTS) continue;
    const cm = L.circleMarker([p.lat,p.lng], {
      radius: RAD[p.sc] ?? 2.4,
      color: p.st.c, weight: 0.6, opacity: .95,
      fillColor: p.st.c, fillOpacity: .55,
      renderer
    });
    cm._p = p;
    cm.addTo(layerAll);
    shownN++;
  }
  document.getElementById('cnt').textContent = ' 路 鍏ㄥ浗 ' + total.toLocaleString() + ' 澶? +
    (hit > shownN ? '锛岃繖鐗囨樉绀?' + shownN.toLocaleString() + ' 澶勶紙鏀惧ぇ鐪嬫洿鍏級' : '');
}

layerAll.on('click', function(ev){
  const p = ev.layer && ev.layer._p;
  if(!p) return;
  popup.setLatLng(ev.latlng).setContent(popHtml(p)).openOn(map);
});

let tmr = null;
map.on('moveend', function(){
  clearTimeout(tmr);
  tmr = setTimeout(renderVisible, 150);
});
renderVisible();

/* ---------- 鍩庡競鎼滅储 ---------- */
var cityList = (window.CITY_INDEX || []);
var qEl = document.getElementById('q');
var sugBox = null;

function normCity(n){
  return (n || '').replace(/(鑷不宸瀨鍦板尯|鐩焲甯倈鍘縷鍖簗鐪?$/,'');
}

function searchCity(kw){
  kw = (kw || '').trim();
  if(!kw) return [];
  var nk = normCity(kw);
  var exact = [], pre = [], part = [];
  cityList.forEach(function(it){
    var n = normCity(it.n);
    if(n === nk) exact.push(it);
    else if(n.indexOf(nk) === 0) pre.push(it);
    else if(n.indexOf(nk) > 0) part.push(it);
  });
  return exact.concat(pre, part).slice(0, 8);
}

function closeSug(){
  if(sugBox && sugBox.parentNode) sugBox.parentNode.removeChild(sugBox);
  sugBox = null;
}

function showSug(list){
  closeSug();
  if(!list.length){
    document.getElementById('locbox').innerHTML =
      '娌℃悳鍒拌繖涓湴鍚?路 鎹釜鍐欐硶璇曡瘯锛屾瘮濡傚彧鍐欍€? + (qEl.value.trim().slice(0,2) || '鍩庡競') + '銆?;
    return;
  }
  sugBox = document.createElement('div');
  sugBox.id = 'qsug';
  list.forEach(function(it){
    var b = document.createElement('span');
    b.className = 'sg';
    b.textContent = it.n;
    b.onclick = function(){ gotoCity(it); };
    sugBox.appendChild(b);
  });
  document.getElementById('panel').insertBefore(sugBox, document.getElementById('locbox'));
}

function gotoCity(it){
  closeSug();
  qEl.value = it.n;
  qEl.blur();
  var z = it.l === 'district' ? 11 : (it.l === 'city' ? 10 : 8);
  if(!showMines){
    showMines = true;
    layerAll.addTo(map);
    document.getElementById('btn2').textContent = '闅愯棌鐭跨偣';
  }
  map.setView([it.c[1], it.c[0]], z);
  if(typeof renderVisible === 'function') renderVisible();
  var box = document.getElementById('locbox');
  var after = function(){
    map.off('moveend', after);
    var inView = 0, near = null, nearD = -1;
    var b = map.getBounds();
    ptsSorted.forEach(function(p){
      if(!b.contains([p.la, p.lo])) return;
      if(!kindsOn[p.kd]) return;
      inView++;

function bearing(la1,lo1,la2,lo2){
  const 蠁1=la1*Math.PI/180, 蠁2=la2*Math.PI/180, 螖位=(lo2-lo1)*Math.PI/180;
  const y=Math.sin(螖位)*Math.cos(蠁2);
  const x=Math.cos(蠁1)*Math.sin(蠁2)-Math.sin(蠁1)*Math.cos(蠁2)*Math.cos(螖位);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function bearName(la1,lo1,la2,lo2){
  const b=bearing(la1,lo1,la2,lo2);
  const d=['姝ｅ寳','涓滃寳鍋忓寳','涓滃寳','涓滃寳鍋忎笢','姝ｄ笢','涓滃崡鍋忎笢','涓滃崡','涓滃崡鍋忓崡',
           '姝ｅ崡','瑗垮崡鍋忓崡','瑗垮崡','瑗垮崡鍋忚タ','姝ｈタ','瑗垮寳鍋忚タ','瑗垮寳','瑗垮寳鍋忓寳'];
  return d[Math.round(b/22.5)%16];
}

const arw = document.getElementById('hdgarw');
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
    h = e.webkitCompassHeading;
  } else if(e.alpha != null && (e.absolute || e.type === 'deviceorientationabsolute')){
    h = 360 - e.alpha;
  }
  if(h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  h = ((h + so) % 360 + 360) % 360;
  arw.classList.add('on');
  arw.style.transform = `rotate(${h}deg)`;
}
function startCompass(){
  if(!window.DeviceOrientationEvent) return;
  const add = ()=>{
    if(startCompass.done) return;
    startCompass.done = true;
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  };
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted') add(); }).catch(()=>{});
  } else add();
}

  function openTip(){
    if(qr.complete && qr.naturalWidth) showQr();
    else { setTimeout(showQr, 800); setTimeout(showQr, 2500); }
    mask.classList.add('show');
  }
  document.getElementById('btn4').onclick = openTip;
  var noBtn = document.getElementById('tipno');
  var noWaiting = false;
  noBtn.onclick = function(){
    if(noWaiting) return;
    noWaiting = true;
    noBtn.disabled = true;
    setTimeout(function(){
      mask.classList.remove('show');
      noWaiting = false;
      noBtn.disabled = false;
    }, 5000);
  };
  mask.onclick = function(ev){ if(ev.target === mask) mask.classList.remove('show'); };
  setTimeout(openTip, 600);
})();
</script>
<script src="sync.js"></script>
</body>
