<!DOCTYPE html>

<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e6eefc;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #map{position:absolute;inset:0;background:#0b1220;}
  #panel{position:absolute;left:10px;right:10px;bottom:10px;z-index:900;

  #title b{color:#ffd66b;font-weight:600}
  .chip{display:inline-block;padding:3px 9px;margin:3px 4px 0 0;border-radius:20px;

  .chip.on{background:#3a2a10;border-color:#ffd66b;color:#ffd66b}
  .chip.k1.on{background:#3a2a10;border-color:#ffd66b;color:#ffd66b}
  .chip.k2.on{background:#0f3020;border-color:#7ee0a8;color:#7ee0a8}
  .chip.k3.on{background:#26313d;border-color:#cbd5e1;color:#e2e8f0}
  .chip.k4.on{background:#241b3a;border-color:#a78bfa;color:#c4b5fd}
  .loc{margin-top:8px;padding-top:8px;border-top:1px dashed #26374f;color:#9fb6d6;font-size:12px}
  .loc b{color:#7ee0a8}
  #btn{position:absolute;right:10px;top:10px;z-index:960;background:#1b3a6b;border:1px solid #3b6bb5;

  #btn2{position:absolute;right:10px;top:56px;z-index:960;background:#1b3a6b;border:1px solid #3b6bb5;

  #btn3{position:absolute;right:10px;top:102px;z-index:960;background:#6b1b3a;border:1px solid #b53b6b;

  #btn3.on{background:#ff5c8a;border-color:#ffc2d6;color:#2a0a16;font-weight:600}

    background:rgba(20,12,20,.95);border:1px solid #4a2238;border-radius:12px;padding:8px;font-size:12px;
    display:none}
  #marks.show{display:block}
  #marks .hd{color:#ff9ec2;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
  #marks .hd span{cursor:pointer;color:#8fb3dd}
  .mk{padding:6px 34px 6px 6px;border-bottom:1px dashed #3a2434;cursor:pointer;position:relative;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mk:hover{background:#2a1524}
  .mk b{color:#ff9ec2;font-weight:600}
  .mk i{color:#7d8fa8;font-size:11px;font-style:normal;display:block;margin-top:2px}
  .mk em{font-style:normal;font-size:11px;color:#8fa8c8;margin-left:5px}

  #marks .ops{margin-top:7px;padding-top:7px;border-top:1px dashed #3a2434;display:flex;gap:6px}
  #marks .ops button{flex:1;background:#2a1524;border:1px solid #4a2238;color:#ffd6e6;
    border-radius:8px;padding:5px 0;font-size:12px}
  #addhint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(40vh + 24px);z-index:950;
    background:#ff5c8a;color:#2a0a16;font-size:13px;padding:7px 14px;border-radius:20px;
    font-weight:600;display:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #addhint.show{display:block}
  #searchwrap{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:965;
    width:calc(100% - 150px);max-width:330px;display:flex;gap:6px}
  #q{flex:1;min-width:0;background:rgba(14,22,38,.96);border:1px solid #23375a;border-radius:20px;
    color:#e6eefc;font-size:13px;padding:8px 14px;outline:none;font-family:inherit}
  #q:focus{border-color:#3b6bb5}
  #qbtn{background:#1b3a6b;border:1px solid #3b6bb5;color:#dce9ff;border-radius:20px;

  #qsug{margin-top:8px}
  #qsug .sg{display:inline-block;padding:3px 9px;margin:3px 4px 0 0;border-radius:20px;
    background:#17263f;border:1px solid #2b4468;font-size:12px;cursor:pointer;white-space:nowrap;color:#cfe0f6}
  .pop{font-size:13px;line-height:1.7}
  .pop h4{margin:0 0 4px;color:#ffd66b;font-size:14px}
  .leaflet-popup-content-wrapper{background:#101c2f;color:#dfe9f7;border:1px solid #2b4468}
  .leaflet-popup-tip{background:#101c2f}
  .leaflet-container{background:#0b1220}
  .darktile{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
  @media (max-width:520px){
    #title{top:8px;left:8px;right:96px;max-width:none;font-size:12px;padding:6px 10px;line-height:1.4;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #title #cnt{display:none}
    #searchwrap{top:44px;left:8px;right:96px;width:auto;max-width:none;transform:none}
    #q{font-size:12px;padding:6px 12px}
    #qbtn{font-size:12px;padding:6px 10px}
    #btn{top:92px}
    #btn2{top:138px}
    #btn3{top:184px}
    #marks{top:232px;width:auto;left:8px;right:8px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="title">中国金矿分布 <b>全国矿产地 2 万+ 处</b><span id="cnt" style="color:#8fb3dd"></span></div>
<button id="btn">定位我</button>
<button id="btn2">隐藏矿点</button>
<div id="searchwrap">
  <input id="q" type="search" placeholder="搜城市，比如 重庆 / 中山" autocomplete="off">
  <button id="qbtn">搜</button>
</div>
<button id="btn3">✚ 添加标记</button>
<div id="addhint">点地图上你要标的地方</div>
<div id="marks">
  <div class="hd">我的标记 <span id="mkclose">收起</span></div>
  <div id="mklist"></div>
  <div class="ops">
    <button id="mkexp">导出</button>
    <button id="mkimp">导入</button>
  </div>
</div>
<input type="file" id="mkfile" accept=".json,application/json" style="display:none">
<div id="panel">
  <div id="chips"><button id="btn4">☕ 投喂</button></div>
  <div class="loc" id="locbox">还没定位 · 点右上角「定位我」，浏览器会问你要权限，允许了才准</div>
</div>

<script src="leaflet/leaflet.js"></script>
<script src="gold-points.js"></script>
<script src="city-index.js"></script>
<script>
const map = L.map('map', {zoomControl:false, attributionControl:false, preferCanvas:true}).setView([34.5, 108], 5);

L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
  subdomains:['1','2','3','4'], maxZoom: 18, className:'darktile'
}).addTo(map);

/* ── WGS84 → GCJ-02（高德底图是火星坐标） ── */
const GCJ_A=6378245.0, GCJ_EE=0.00669342162296594323;
function outOfChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;}
function tLat(x,y){
  let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
  r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  return r;
}
function tLng(x,y){
  let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
  r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  return r;
}
function toGcj(lng,lat){
  if(outOfChina(lng,lat)) return [lng,lat];
  let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  const rad=lat/180*Math.PI; let magic=Math.sin(rad); magic=1-GCJ_EE*magic*magic;
  const sq=Math.sqrt(magic);
  dLat=(dLat*180)/((GCJ_A*(1-GCJ_EE))/(magic*sq)*Math.PI);
  dLng=(dLng*180)/(GCJ_A/sq*Math.cos(rad)*Math.PI);
  return [lng+dLng, lat+dLat];
}

/* ── 数据：全国矿产地公开名录，金/银/砂金/铂矿共 2 万余处 ── */
const D = window.GOLD_DATA;
const SC = D.scales, US = D.uses, NM = D.names;
const KIND_STYLE = {
  '金矿':   {c:'#ffd66b', cls:'k1', label:'岩金'},
  '砂金':   {c:'#7ee0a8', cls:'k2', label:'砂金'},
  '银矿':   {c:'#cbd5e1', cls:'k3', label:'银矿'},
  '铂矿':   {c:'#a78bfa', cls:'k4', label:'铂矿'}
};
function kindStyle(t){
  for(const k in KIND_STYLE) if(t.indexOf(k)>=0) return KIND_STYLE[k];
  return {c:'#94a3b8', cls:'k3', label:'其他'};
}
const RAD = [6,5.5,4.5,3.5,2.6,2.2,2,2.4];

const kindsOn = {'岩金':true,'砂金':true,'银矿':true,'铂矿':true,'其他':true};

const pts = D.pts.map(p=>{
  const [la,lo,ni,sc,us,kd] = p;
  const name = NM[ni] || '(未具名)';
  const st = kindStyle(kd);
  return {lat:la, lng:lo, name, sc, us, kd, st};
});
const total = pts.length;

const renderer = L.canvas({padding:0.3});
const layerAll = L.layerGroup().addTo(map);

/* 手机上一次性画两万个点会卡死，改成「只画当前视野里最重要的那批」 */
const MAXPTS = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ? 700 : 3000;
const ptsSorted = pts.slice().sort((a,b)=>(a.sc|0)-(b.sc|0));   // 规模大的排前面
const popup = L.popup({maxWidth:260});
let shownN = 0;

function popHtml(p){
  return `<div class="pop"><h4>${p.name}</h4>
    <div style="color:#8fb3dd;font-size:12px;margin-bottom:5px">
      ${p.kd} · ${SC[p.sc]||'未标注'} · ${US[p.us]||'未标注'}<br>
      约 ${p.lat.toFixed(3)}, ${p.lng.toFixed(3)}（精度约百米，公开名录坐标）</div></div>`;
}

function renderVisible(){
  layerAll.clearLayers();
  shownN = 0;
  if(!map.hasLayer(layerAll)) return;
  const b = map.getBounds().pad(0.1);
  const s=b.getSouth(), n=b.getNorth(), w=b.getWest(), e=b.getEast();
  let hit = 0;
  for(let i=0;i<ptsSorted.length;i++){
    const p = ptsSorted[i];
    if(p.lat<s||p.lat>n||p.lng<w||p.lng>e) continue;
    if(!kindsOn[p.st.label]) continue;
    hit++;
    if(shownN >= MAXPTS) continue;
    const cm = L.circleMarker([p.lat,p.lng], {
      radius: RAD[p.sc] ?? 2.4,
      color: p.st.c, weight: 0.6, opacity: .95,
      fillColor: p.st.c, fillOpacity: .55,
      renderer
    });
    cm._p = p;
    cm.addTo(layerAll);
    shownN++;
  }
  document.getElementById('cnt').textContent = ' · 全国 ' + total.toLocaleString() + ' 处' +
    (hit > shownN ? '，这片显示 ' + shownN.toLocaleString() + ' 处（放大看更全）' : '');
}

layerAll.on('click', function(ev){
  const p = ev.layer && ev.layer._p;
  if(!p) return;
  popup.setLatLng(ev.latlng).setContent(popHtml(p)).openOn(map);
});

let tmr = null;
map.on('moveend', function(){
  clearTimeout(tmr);
  tmr = setTimeout(renderVisible, 150);
});
renderVisible();

/* ---------- 城市搜索 ---------- */
var cityList = (window.CITY_INDEX || []);
var qEl = document.getElementById('q');
var sugBox = null;

function normCity(n){
  return (n || '').replace(/(自治州|地区|盟|市|县|区|省)$/,'');
}

function searchCity(kw){
  kw = (kw || '').trim();
  if(!kw) return [];
  var nk = normCity(kw);
  var exact = [], pre = [], part = [];
  cityList.forEach(function(it){
    var n = normCity(it.n);
    if(n === nk) exact.push(it);
    else if(n.indexOf(nk) === 0) pre.push(it);
    else if(n.indexOf(nk) > 0) part.push(it);
  });
  return exact.concat(pre, part).slice(0, 8);
}

function closeSug(){
  if(sugBox && sugBox.parentNode) sugBox.parentNode.removeChild(sugBox);
  sugBox = null;
}

function showSug(list){
  closeSug();
  if(!list.length){
    document.getElementById('locbox').innerHTML =
      '没搜到这个地名 · 换个写法试试，比如只写「' + (qEl.value.trim().slice(0,2) || '城市') + '」';
    return;
  }
  sugBox = document.createElement('div');
  sugBox.id = 'qsug';
  list.forEach(function(it){
    var b = document.createElement('span');
    b.className = 'sg';
    b.textContent = it.n;
    b.onclick = function(){ gotoCity(it); };
    sugBox.appendChild(b);
  });
  document.getElementById('panel').insertBefore(sugBox, document.getElementById('locbox'));
}

function gotoCity(it){
  closeSug();
  qEl.value = it.n;
  qEl.blur();
  var z = it.l === 'district' ? 11 : (it.l === 'city' ? 10 : 8);
  if(!showMines){
    showMines = true;
    layerAll.addTo(map);
    document.getElementById('btn2').textContent = '隐藏矿点';
  }
  map.setView([it.c[1], it.c[0]], z);
  if(typeof renderVisible === 'function') renderVisible();
  var box = document.getElementById('locbox');
  var after = function(){
    map.off('moveend', after);
    var inView = 0, near = null, nearD = -1;
    var b = map.getBounds();
    ptsSorted.forEach(function(p){
      if(!b.contains([p.la, p.lo])) return;
      if(!kindsOn[p.kd]) return;
      inView++;
    });
    box.innerHTML = '已跳到 <b>' + it.n + '</b> · 这一屏有 <b>' + inView + '</b> 处矿点'
      + (inView ? '' : ' · 这块暂时没录到，换周边城市看看');
  };
  map.on('moveend', after);
}

document.getElementById('qbtn').onclick = function(){ showSug(searchCity(qEl.value)); };
qEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    var list = searchCity(qEl.value);
    if(list.length === 1) gotoCity(list[0]);
    else showSug(list);
    e.preventDefault();
  }
});
qEl.addEventListener('input', function(){
  var v = qEl.value.trim();
  if(v.length >= 1 && cityList.length){
    var list = searchCity(v);
    if(list.length && normCity(list[0].n) === normCity(v)){ closeSug(); return; }
    showSug(list);
  } else closeSug();
});
map.on('movestart', closeSug);

function applyFilter(){ renderVisible(); }

/* ── 底部矿种筛选 chips ── */
const chips = document.getElementById('chips');
Object.keys(kindsOn).forEach(k=>{
  const s = document.createElement('span');
  const found = Object.keys(KIND_STYLE).find(x=>KIND_STYLE[x].label===k);
  const cls = (KIND_STYLE[found]||{cls:'k3'}).cls;
  s.className='chip '+cls+(kindsOn[k]?' on':'');
  s.textContent = k;
  s.onclick=()=>{
    kindsOn[k]=!kindsOn[k];
    s.classList.toggle('on', kindsOn[k]);
    applyFilter();
  };
  chips.appendChild(s);
});

/* ── 定位 ── */
let me=null, acc=null;
const locbox = document.getElementById('locbox');
document.getElementById('btn').onclick = ()=>{
  if(!navigator.geolocation){ locbox.textContent='这个浏览器没有定位能力'; return; }
  locbox.innerHTML = '正在定位…手机上 GPS 要几秒，电脑靠 WiFi 定位误差会大得多';
  navigator.geolocation.watchPosition(pos=>{
    const {latitude:la, longitude:lo, accuracy:ac} = pos.coords;
    if(!me){
      me = L.circleMarker([la,lo],{radius:7,color:'#fff',weight:2,fillColor:'#4da3ff',fillOpacity:1}).addTo(map)
            .bindPopup('你在这儿');
      acc = L.circle([la,lo],{radius:ac,color:'#4da3ff',weight:1,fillOpacity:.1,fillColor:'#4da3ff'}).addTo(map);
      map.setView([la,lo], Math.max(map.getZoom(),12));
    } else {
      me.setLatLng([la,lo]);
      acc.setLatLng([la,lo]).setRadius(ac);
    }
    let best=null, bd=1e18;
    for(const p of pts){
      const R=6371, dLat=(p.lat-la)*Math.PI/180, dLng=(p.lng-lo)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(la*Math.PI/180)*Math.cos(p.lat*Math.PI/180)*Math.sin(dLng/2)**2;
      const d = 2*R*Math.asin(Math.sqrt(a));
      if(d<bd){bd=d;best=p;}
    }
    locbox.innerHTML = `定位 <b>${la.toFixed(5)}, ${lo.toFixed(5)}</b> · 精度 <b>±${Math.round(ac)} 米</b><br>
      最近的金矿点：<b>${best.name}</b>（${best.kd}）直线约 <b>${bd.toFixed(1)} 公里</b>
      <span style="color:#6f88a8">（名录坐标精度约百米，能给你方向，不能当矿口位置）</span>`;
  }, err=>{
    const m = {1:'你拒绝了定位权限', 2:'拿不到位置信号', 3:'定位超时了'};
    locbox.textContent = (m[err.code]||'定位失败') + ' · ' + err.message;
  }, {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
};

/* ── 矿点总开关 ── */
let showMines = true;
document.getElementById('btn2').onclick = ()=>{
  showMines = !showMines;
  if(showMines){ layerAll.addTo(map); renderVisible(); } else map.removeLayer(layerAll);
  document.getElementById('btn2').textContent = showMines ? '隐藏矿点' : '显示矿点';
};

/* ══════ 我的标记（只存本机浏览器，不上传） ══════ */
var MK_KEY = 'goldmap.marks.v1';
var marks = [];
try { marks = JSON.parse(localStorage.getItem(MK_KEY) || '[]') || []; } catch(e){ marks = []; }
/* 删除名单：删过的 id 记下来，从别人的设备同步回来时也不会复活 */
var DEL_KEY = 'goldmap.del.v1';
var deleted = [];
try { deleted = JSON.parse(localStorage.getItem(DEL_KEY) || '[]') || []; } catch(e){ deleted = []; }
window.__getDel = function(){ return deleted; };
window.__addDel = function(id){
  if(!id || deleted.indexOf(id) >= 0) return;
  deleted.push(id);
  if(deleted.length > 800) deleted = deleted.slice(-800);
  try { localStorage.setItem(DEL_KEY, JSON.stringify(deleted)); } catch(e){}
};

var markLayer = L.layerGroup().addTo(map);

/* 本机身份：用来判断哪些标记是我自己传的 */
var MY_ID = '';
try { MY_ID = localStorage.getItem('mk_uid') || ''; } catch(e){}
if(!MY_ID){
  MY_ID = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try { localStorage.setItem('mk_uid', MY_ID); } catch(e){}
}
function isMine(m){ return !m.o || m.o === MY_ID; }
/* 管理员模式：本机手动开启后可以删任何人的点（只影响这台手机） */
var IS_ADMIN = false;
try { IS_ADMIN = localStorage.getItem('mk_admin') === '1'; } catch(e){}
function isAdmin(){ return IS_ADMIN; }
function canDel(m){ return isMine(m) || isAdmin(); }
var adding = false;

function saveMarks(){
  try { localStorage.setItem(MK_KEY, JSON.stringify(marks)); }
  catch(e){ alert('存不下了，可能是隐私模式或者空间满了'); }
}

function drawMarks(){
  markLayer.clearLayers();
  marks.forEach(function(m){
    L.marker([m.lat, m.lng], {
      icon: L.divIcon({
        className:'',
        html:'<div style="width:16px;height:16px;border-radius:50%;background:#ff5c8a;border:2px solid #fff;box-shadow:0 0 0 2px rgba(255,92,138,.45)"></div>',
        iconSize:[16,16], iconAnchor:[8,8]
      })
    }).addTo(markLayer).bindPopup(
      '<div class="pop"><h4>'+m.name+'</h4>'+
      '<div style="color:#8fb3dd;font-size:12px">'+(m.note ? m.note+'<br>' : '')+
      m.lat+', '+m.lng+'</div></div>', {maxWidth:240});
  });
}

/* 连点左上标题 5 下，切换管理员模式 */
(function(){
  var t = document.getElementById('title'), n = 0, tm = null;
  if(!t) return;
  t.addEventListener('click', function(){
    n++; clearTimeout(tm); tm = setTimeout(function(){ n = 0; }, 1200);
    if(n >= 5){
      n = 0;
      IS_ADMIN = !IS_ADMIN;
      try { localStorage.setItem('mk_admin', IS_ADMIN ? '1' : '0'); } catch(e){}
      renderList();
      alert(IS_ADMIN ? '管理员模式已开启：可以删所有人的点' : '管理员模式已关闭');
    }
  });
})();

var mkbox = document.getElementById('marks');
var mklist = document.getElementById('mklist');

function renderList(){
  if(mkChip) mkChip.textContent = '📍 我的标记 ' + marks.length;
  if(!marks.length){
    mklist.innerHTML = '<div class="mktip">还没有标记。点右边「✚ 添加标记」，再点地图上你要标的地方。</div>';
    return;
  }
  mklist.innerHTML = '';
  marks.slice().reverse().forEach(function(m){
    var d = document.createElement('div');
    d.className = 'mk';
    var mine = isMine(m);
    d.innerHTML = (canDel(m) ? '<u data-del="'+m.id+'">删</u>' : '') +
      '<b>'+m.name+'</b>' + (mine ? '' : '<em>别人的</em>') +
      '<i>'+(m.note || '（无备注）')+' · '+m.lat+', '+m.lng+'</i>';
    d.onclick = function(ev){
      if(ev.target.dataset.del){
        var id = ev.target.dataset.del;
        if(confirm('删掉「'+m.name+'」？')){
          window.__addDel(id);
          marks = marks.filter(function(x){ return x.id !== id; });
          saveMarks(); drawMarks(); renderList();
        }
        return;
      }
      map.flyTo([m.lat, m.lng], 15);
      markLayer.eachLayer(function(l){
        var ll = l.getLatLng();
        if(ll.lat===m.lat && ll.lng===m.lng) l.openPopup();
      });
    };
    mklist.appendChild(d);
  });
}

var btn3 = document.getElementById('btn3');
var addhint = document.getElementById('addhint');
btn3.onclick = function(){
  adding = !adding;
  btn3.classList.toggle('on', adding);
  btn3.textContent = adding ? '取消添加' : '✚ 添加标记';
  addhint.classList.toggle('show', adding);
  map.getContainer().style.cursor = adding ? 'crosshair' : '';
  if(adding) mkbox.classList.remove('show');
};

function openMarkDialog(latlng){
  var name = prompt('给这个点起个名字', '我的点');
  if(name === null) return;
  var note = prompt('备注（可以留空）', '');
  if(note === null) note = '';
  var m = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: (name||'').trim() || '我的点',
    note: (note||'').trim(),
    lat: +latlng.lat.toFixed(5),
    lng: +latlng.lng.toFixed(5),
    o: MY_ID,
    t: Date.now()
  };
  marks.push(m);
  saveMarks(); drawMarks(); renderList();
  map.flyTo([m.lat, m.lng], Math.max(map.getZoom(), 14));
}

map.on('click', function(e){
  if(!adding) return;
  adding = false;
  btn3.classList.remove('on');
  btn3.textContent = '✚ 添加标记';
  addhint.classList.remove('show');
  map.getContainer().style.cursor = '';
  openMarkDialog(e.latlng);
});

document.getElementById('mkclose').onclick = function(){ mkbox.classList.remove('show'); };

document.getElementById('mkexp').onclick = function(){
  if(!marks.length){ alert('还没有标记可以导出'); return; }
  var blob = new Blob([JSON.stringify({v:1, marks:marks}, null, 1)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-marks-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
};

var mkfile = document.getElementById('mkfile');
document.getElementById('mkimp').onclick = function(){ mkfile.click(); };
mkfile.onchange = function(){
  var f = mkfile.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var j = JSON.parse(r.result);
      var arr = Array.isArray(j) ? j : (j.marks || []);
      if(!arr.length) throw new Error('里面没有标记');
      var have = {};
      marks.forEach(function(m){ have[m.id] = 1; });
      var n = 0;
      arr.forEach(function(m){
        if(!m || typeof m.lat !== 'number' || typeof m.lng !== 'number') return;
        if(m.id && have[m.id]) return;
        marks.push({
          id: m.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
          name: m.name || '我的点',
          note: m.note || '',
          lat: m.lat, lng: m.lng,
          t: m.t || Date.now()
        });
        n++;
      });
      saveMarks(); drawMarks(); renderList();
      alert('导入 ' + n + ' 条');
    }catch(err){ alert('文件读不了：' + err.message); }
    mkfile.value = '';
  };
  r.readAsText(f);
};

/* 底部加一个「我的标记」chip 开关列表 */
var mkChip = document.createElement('span');
mkChip.className = 'chip';
mkChip.style.borderColor = '#b53b6b';
mkChip.style.color = '#ff9ec2';
mkChip.textContent = '📍 我的标记';
chips.appendChild(mkChip);
mkChip.onclick = function(){
  renderList();
  mkbox.classList.toggle('show');
};

drawMarks();
renderList();
</script>

<div id="tipmask">
  <div id="tipbox">
    <h3>祝老板生意兴隆<br>财源广进 日进斗金</h3>
    <p>扫码投喂 · 随意就好<br>一分钱也是心意，小满都记着</p>
    <img class="qr" id="tipqr" src="qr.png?v=4" alt="微信赞助码" onerror="this.style.display='none'">
    <div class="qrtip" id="qrtip">微信扫一扫这张图，赞助小满<div style="margin-top:4px;color:#8fa8c8">手机长按图片可保存，或点下方保存</div></div>
    <a class="qrdl" id="qrdl" href="qr.png" download="赞助码.png">保存赞助码</a>
    <button id="tipno" class="lock">暂不投喂</button>
  </div>
</div>

<script>
(function(){
  var mask = document.getElementById('tipmask');
  var qr = document.getElementById('tipqr');
  var qrtip = document.getElementById('qrtip');
  var go = document.getElementById('tipgo');
  var qrdl = document.getElementById('qrdl');
  function showQr(){
    if(!qr.naturalWidth) return;
    qr.classList.add('show'); qrtip.classList.add('show'); qrdl.classList.add('show');
  }
  qr.addEventListener('load', showQr);
  var noBtn = document.getElementById('tipno');
  var unlockAt = 0;
  function lockNo(){
    unlockAt = Date.now() + 5000;
    noBtn.classList.add('lock');
  }
  function unlocked(){ return Date.now() >= unlockAt; }
  function openTip(){
    if(qr.complete && qr.naturalWidth) showQr();
    else { setTimeout(showQr, 800); setTimeout(showQr, 2500); }
    if(go) go.style.display = 'none';
    mask.classList.add('show');
    lockNo();
  }
  function closeTip(){ mask.classList.remove('show'); }
  document.getElementById('btn4').onclick = openTip;
  noBtn.onclick = function(){ if(!unlocked()) return; closeTip(); };
  mask.onclick = function(ev){
    if(ev.target !== mask) return;
    if(!unlocked()) return;
    closeTip();
  };
  setTimeout(openTip, 600);
})();
</script>
