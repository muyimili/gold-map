<style>

  #qsug{margin-top:8px}

  @media (max-width:520px){

</style>

<body>
<div id="map"></div>
<div id="title">中国金矿分布 <b>全国矿产地 2 万+ 处</b><span id="cnt" style="color:#8fb3dd"></span></div>
<div id="compass">
  <div class="nd">N</div><div class="sd">S</div><div class="wd">W</div><div class="ed">E</div>
  <div class="dt"></div>
  <div class="arw" id="hdgarw"></div>
</div>
<button id="btn">定位我</button>
<button id="btn6" title="定位权限说明">🔓</button>
<button id="btn2">隐藏矿点</button>
<div id="searchwrap">
  <input id="q" type="search" placeholder="搜城市，比如 重庆 / 中山" autocomplete="off">
  <button id="qbtn">搜</button>
</div>
<button id="btn3">✚ 添加标记</button>
<div id="addhint">点地图上你要标的地方</div>
<button id="btn5">⟳ 刷新</button>
<div id="marks">
  <div class="hd">我的标记 <span id="mkclose">收起</span></div>
  <div id="mklist"></div>
  <div class="ops">
    <button id="mkexp">导出</button>
    <button id="mkimp">导入</button>
  </div>
</div>
<input type="file" id="mkfile" accept=".json,application/json" style="display:none">
<div id="near">
  <div class="hd">附近矿点 <span id="nrclose">收起</span></div>
  <div id="nrlist"></div>
</div>
<div id="panel">
  <div id="chips"><button id="btn7">🛰 卫星</button><button id="btn4">☕ 投喂</button><button id="nrbtn">📋 附近</button><button id="fb4">💬 反馈</button></div>
  <div class="loc" id="locbox">还没定位 · 点右上角「定位我」，浏览器会问你要权限，允许了才准</div>
</div>

<script src="leaflet/leaflet.js"></script>
<script src="gold-points.js"></script>
<script src="city-index.js"></script>
<script>
const map = L.map('map', {zoomControl:false, attributionControl:false, preferCanvas:true}).setView([34.5, 108], 5);

/* ── 底图：主用高德，失败自动切腾讯（两者都是 GCJ-02，坐标不用改） ── */
const TILE_MAIN = {
  url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',
  opt:{subdomains:['1','2','3','4'], maxZoom:18, className:'darktile'}
};
const TILE_BAK = {
  url:'https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={y}&type=vector&styleid=3',
  opt:{subdomains:['0','1','2','3'], maxZoom:18, className:'darktile'}
};
let mainLayer = null, bakLayer = null, tileErr = 0, switched = false;

function useMain(){
  if(bakLayer){ map.removeLayer(bakLayer); bakLayer = null; }
  if(mainLayer) map.removeLayer(mainLayer);
  tileErr = 0;
  mainLayer = L.tileLayer(TILE_MAIN.url, TILE_MAIN.opt);
  mainLayer.on('tileerror', function(){
    if(switched) return;
    tileErr++;
    if(tileErr >= 6) useBak();
  });
  mainLayer.addTo(map);
  mainLayer.bringToBack();
}
function useBak(){
  if(switched) return;
  switched = true;
  if(mainLayer){ map.removeLayer(mainLayer); mainLayer = null; }
  bakLayer = L.tileLayer(TILE_BAK.url, TILE_BAK.opt);
  bakLayer.addTo(map);
  bakLayer.bringToBack();
  /* 备用源也挂了就再试主源一次 */
  bakLayer.on('tileerror', function(){
    setTimeout(function(){ switched = false; useMain(); }, 3000);
  });
}
useMain();

/* ── 卫星影像：高德影像图，同样是 GCJ-02，标记不用重算 ── */
const TILE_SAT = {
  url:'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
  opt:{subdomains:['1','2','3','4'], maxZoom:18}
};
const TILE_SATLBL = {
  url:'https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}',
  opt:{subdomains:['1','2','3','4'], maxZoom:18}
};
let satLayer = null, satLbl = null, satOn = false;
function toggleSat(){
  satOn = !satOn;
  if(satOn){
    if(mainLayer){ map.removeLayer(mainLayer); mainLayer = null; }
    if(bakLayer){ map.removeLayer(bakLayer); bakLayer = null; }
    switched = true;
    satLayer = L.tileLayer(TILE_SAT.url, TILE_SAT.opt).addTo(map);
    satLbl = L.tileLayer(TILE_SATLBL.url, TILE_SATLBL.opt).addTo(map);
    satLayer.bringToBack();
  }else{
    if(satLayer){ map.removeLayer(satLayer); satLayer = null; }
    if(satLbl){ map.removeLayer(satLbl); satLbl = null; }
    switched = false; useMain();
  }
  var b = document.getElementById('btn7');
  if(b){ b.classList.toggle('on', satOn); b.textContent = satOn ? '🗺 普通' : '🛰 卫星'; }
}
map.on('zoomend moveend', function(){
  if(switched) return;
  setTimeout(function(){
    if(!switched && tileErr >= 6) useBak();
  }, 1200);
});

/* ── WGS84 → GCJ-02（高德底图是火星坐标） ── */
const GCJ_A=6378245.0, GCJ_EE=0.00669342162296594323;
function outOfChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;}
function tLat(x,y){
  let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
  r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  return r;
}
function tLng(x,y){
  let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
  r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  return r;
}
function toGcj(lng,lat){
  if(outOfChina(lng,lat)) return [lng,lat];
  let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  const rad=lat/180*Math.PI; let magic=Math.sin(rad); magic=1-GCJ_EE*magic*magic;
  const sq=Math.sqrt(magic);
  dLat=(dLat*180)/((GCJ_A*(1-GCJ_EE))/(magic*sq)*Math.PI);
  dLng=(dLng*180)/(GCJ_A/sq*Math.cos(rad)*Math.PI);
  return [lng+dLng, lat+dLat];
}

/* ── 数据：全国矿产地公开名录，金/银/砂金/铂矿共 2 万余处 ── */
const D = window.GOLD_DATA;
const SC = D.scales, US = D.uses, NM = D.names;
const KIND_STYLE = {
  '金矿':   {c:'#ffd66b', cls:'k1', label:'岩金'},
  '砂金':   {c:'#7ee0a8', cls:'k2', label:'砂金'},
  '银矿':   {c:'#cbd5e1', cls:'k3', label:'银矿'},
  '铂矿':   {c:'#a78bfa', cls:'k4', label:'铂矿'}
};
function kindStyle(t){
  for(const k in KIND_STYLE) if(t.indexOf(k)>=0) return KIND_STYLE[k];
  return {c:'#94a3b8', cls:'k3', label:'其他'};
}
const RAD = [6,5.5,4.5,3.5,2.6,2.2,2,2.4];

const kindsOn = {'岩金':true,'砂金':true,'银矿':true,'铂矿':true,'其他':true};

const pts = D.pts.map(p=>{
  const [la,lo,ni,sc,us,kd] = p;
  const name = NM[ni] || '(未具名)';
  const st = kindStyle(kd);
  return {lat:la, lng:lo, name, sc, us, kd, st};
});
const total = pts.length;

const renderer = L.canvas({padding:0.3});
const layerAll = L.layerGroup().addTo(map);

/* 手机上一次性画两万个点会卡死，改成「只画当前视野里最重要的那批」 */
const MAXPTS = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ? 700 : 3000;
const ptsSorted = pts.slice().sort((a,b)=>(a.sc|0)-(b.sc|0));   // 规模大的排前面
const popup = L.popup({maxWidth:260});
let shownN = 0;

function popHtml(p){
  return `<div class="pop"><h4>${p.name}</h4>
    <div style="color:#8fb3dd;font-size:12px;margin-bottom:5px">
      ${p.kd} · ${SC[p.sc]||'未标注'} · ${US[p.us]||'未标注'}<br>
      约 ${p.lat.toFixed(3)}, ${p.lng.toFixed(3)}（精度约百米，公开名录坐标）</div>
    <a href="javascript:0" class="shr" data-la="${p.lat}" data-lo="${p.lng}" data-nm="${p.name}"
      style="display:inline-block;margin-top:4px;padding:3px 9px;border-radius:14px;background:#1b3a6b;
      border:1px solid #3b6bb5;color:#dce9ff;font-size:12px;text-decoration:none">分享这个点</a></div>`;
}

/* 分享：复制一个带坐标的链接，别人打开直接跳到这个点 */
document.addEventListener('click', function(ev){
  var a = ev.target.closest && ev.target.closest('.shr');
  if(!a) return;
  ev.preventDefault();
  var la = a.dataset.la, lo = a.dataset.lo, nm = a.dataset.nm || '';
  var u = location.origin + location.pathname +
    '?lat=' + (+la).toFixed(5) + '&lng=' + (+lo).toFixed(5) + '&z=14' + (nm ? '&n=' + encodeURIComponent(nm) : '');
  var done = function(txt){ locbox.innerHTML = '<span style="color:#7fd8a8">' + txt + '</span> ' + u; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(function(){ done('链接复制好了：'); },
      function(){ done('复制没成功，自己复制这一行：'); });
  } else {
    done('自己复制这一行：');
  }
});

/* 打开带坐标的分享链接：直接跳过去 */
(function(){
  var qs = new URLSearchParams(location.search);
  if(!qs.get('lat') || !qs.get('lng')) return;
  var la = parseFloat(qs.get('lat')), lo = parseFloat(qs.get('lng')), z = parseFloat(qs.get('z')) || 14;
  var nm = qs.get('n') || '';
  if(isNaN(la) || isNaN(lo)) return;
  setTimeout(function(){
    map.setView([la, lo], z);
    L.circleMarker([la, lo], {radius:9, color:'#ffd66b', weight:3, fillColor:'#ffd66b', fillOpacity:.85})
      .addTo(map)
      .bindPopup('<div class="pop"><h4>' + (nm || '分享的点') + '</h4>' +
        '<div style="color:#8fb3dd;font-size:12px">' + la + ', ' + lo + '</div></div>').openPopup();
  }, 300);
})();

function renderVisible(){
  layerAll.clearLayers();
  shownN = 0;
  if(!map.hasLayer(layerAll)) return;
  const b = map.getBounds().pad(0.1);
  const s=b.getSouth(), n=b.getNorth(), w=b.getWest(), e=b.getEast();
  let hit = 0;
  for(let i=0;i<ptsSorted.length;i++){
    const p = ptsSorted[i];
    if(p.lat<s||p.lat>n||p.lng<w||p.lng>e) continue;
    if(!kindsOn[p.st.label]) continue;
    hit++;
    if(shownN >= MAXPTS) continue;
    const cm = L.circleMarker([p.lat,p.lng], {
      radius: RAD[p.sc] ?? 2.4,
      color: p.st.c, weight: 0.6, opacity: .95,
      fillColor: p.st.c, fillOpacity: .55,
      renderer
    });
    cm._p = p;
    cm.addTo(layerAll);
    shownN++;
  }
  document.getElementById('cnt').textContent = ' · 全国 ' + total.toLocaleString() + ' 处' +
    (hit > shownN ? '，这片显示 ' + shownN.toLocaleString() + ' 处（放大看更全）' : '');
}

layerAll.on('click', function(ev){

function normCity(n){
  return (n || '').replace(/(自治州|地区|盟|市|县|区|省)$/,'');
}

function searchCity(kw){
  kw = (kw || '').trim();
  if(!kw) return [];
  var nk = normCity(kw);
  var exact = [], pre = [], part = [];
  cityList.forEach(function(it){
    var n = normCity(it.n);
    if(n === nk) exact.push(it);
    else if(n.indexOf(nk) === 0) pre.push(it);
    else if(n.indexOf(nk) > 0) part.push(it);
  });
  return exact.concat(pre, part).slice(0, 8);
}

/* ── 方位角转中文方向 ── */
function bearing(la1,lo1,la2,lo2){
  const φ1=la1*Math.PI/180, φ2=la2*Math.PI/180, Δλ=(lo2-lo1)*Math.PI/180;
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function bearName(la1,lo1,la2,lo2){
  const b=bearing(la1,lo1,la2,lo2);
  const d=['正北','东北偏北','东北','东北偏东','正东','东南偏东','东南','东南偏南',
           '正南','西南偏南','西南','西南偏西','正西','西北偏西','西北','西北偏北'];
  return d[Math.round(b/22.5)%16];
}

/* ── 附近矿点：按当前筛选 + 距离排序 ── */
function distKm(la1,lo1,la2,lo2){
  const R=6371, r=x=>x*Math.PI/180;
  const dLa=r(la2-la1), dLo=r(lo2-lo1);
  const a=Math.sin(dLa/2)**2 + Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function buildNear(){
  const src = me ? [me.lat, me.lng] : map.getCenter();

    const p = pts[i];
    if(!kindsOn[p.st.label]) continue;
    arr.push({p, d: distKm(c.lat,c.lng,p.lat,p.lng)});
  }
  arr.sort((a,b)=>a.d-b.d);
  const top = arr.slice(0, 40);
  if(!top.length){ nrlist.innerHTML = '<div class="nr">筛完了，一个点都没有</div>'; return; }
  nrlist.innerHTML = '';
  top.forEach(o=>{
    const p = o.p;
    const d = o.d < 1 ? Math.round(o.d*1000)+' 米' : o.d.toFixed(1)+' 公里';
    const div = document.createElement('div');

      bearName(c.lat,c.lng,p.lat,p.lng)+'</i>';
    div.onclick = ()=> map.flyTo([p.lat,p.lng], 13);
    nrlist.appendChild(div);
  });
}

const arw = document.getElementById('hdgarw');
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
    h = e.webkitCompassHeading;
  } else if(e.alpha != null && (e.absolute || e.type === 'deviceorientationabsolute')){
    h = 360 - e.alpha;
  }
  if(h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  h = ((h + so) % 360 + 360) % 360;
  arw.classList.add('on');
  arw.style.transform = `rotate(${h}deg)`;
}
function startCompass(){
  if(!window.DeviceOrientationEvent) return;
  const add = ()=>{
    if(startCompass.done) return;
    startCompass.done = true;
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  };
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted') add(); }).catch(()=>{});
  } else add();
}

document.getElementById('btn6').onclick = async function(){

      const r = await navigator.permissions.query({name:'geolocation'});

    locbox.textContent = '正在请求定位…';
    document.getElementById('btn').click();

  }
  locbox.innerHTML = '浏览器已经记住「拒绝」了，网页没法自己改回来，只能手动开：<br>'
    + '① 点地址栏左边的 🔒 或 ⓘ → 位置信息 → 改成「允许」<br>'
    + '② 找不到就去 浏览器设置 → 网站设置 → 位置信息 → 把 muyimili.github.io 删掉<br>'
    + '③ 弄完再点「定位我」'
    + '<br><span style="color:#ffb46b">（这是浏览器的限制，网页跳不过去）</span>';

document.getElementById('btn').onclick = ()=>{
  startCompass();
  if(!navigator.geolocation){ locbox.textContent='这个浏览器没有定位能力'; return; }
  locbox.innerHTML = '正在定位…手机上 GPS 要几秒，电脑靠 WiFi 定位误差会大得多';
  navigator.geolocation.watchPosition(pos=>{
    const {latitude:la, longitude:lo, accuracy:ac} = pos.coords;
    if(!me){
      acc = L.circle([la,lo],{radius:ac,color:'#4da3ff',weight:1,fillOpacity:.1,fillColor:'#4da3ff'}).addTo(map);
      me = L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#ff3b6b',fillOpacity:1,className:'memark'}).addTo(map)
            .bindPopup('我在这儿');
      meLbl = L.marker([la,lo],{icon:L.divIcon({className:'melbl',html:'我在这儿',iconSize:[74,24],iconAnchor:[-8,14]}),interactive:false}).addTo(map);
      me.bringToFront(); meLbl.getElement && setTimeout(()=>meLbl.getElement()&&meLbl.getElement().style.setProperty('z-index',900),0);
      map.setView([la,lo], Math.max(map.getZoom(),12));
    } else {
      me.setLatLng([la,lo]);
      meLbl.setLatLng([la,lo]);
      me.bringToFront();
      acc.setLatLng([la,lo]).setRadius(ac);
    }
    let best=null, bd=1e18;
    for(const p of pts){
      const R=6371, dLat=(p.lat-la)*Math.PI/180, dLng=(p.lng-lo)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(la*Math.PI/180)*Math.cos(p.lat*Math.PI/180)*Math.sin(dLng/2)**2;
      const d = 2*R*Math.asin(Math.sqrt(a));
      if(d<bd){bd=d;best=p;}
    }
    locbox.innerHTML = `我在这儿 <b>${la.toFixed(5)}, ${lo.toFixed(5)}</b> · 精度 <b>±${Math.round(ac)} 米</b><br>
      最近的金矿点：<b>${best.name}</b>（${best.kd}）直线约 <b>${bd.toFixed(1)} 公里</b> · 方向 <b>${bearName(la,lo,best.lat,best.lng)}</b>

  }, err=>{
    const m = {1:'你拒绝了定位权限', 2:'拿不到位置信号', 3:'定位超时了'};
    locbox.innerHTML = (m[err.code]||'定位失败') + (err.code===1 ? ' · 点右边的🔓看怎么改回来' : '') + ' · ' + err.message;

};

<script>
(function(){
  var mask = document.getElementById('tipmask');
  var qr = document.getElementById('tipqr');
  var qrtip = document.getElementById('qrtip');
  var go = document.getElementById('tipgo');
  var qrdl = document.getElementById('qrdl');
  function showQr(){
    if(!qr.naturalWidth) return;
    qr.classList.add('show'); qrtip.classList.add('show'); qrdl.classList.add('show');
  }
  qr.addEventListener('load', showQr);
  function openTip(){
    if(qr.complete && qr.naturalWidth) showQr();
    else { setTimeout(showQr, 800); setTimeout(showQr, 2500); }
    mask.classList.add('show');
  }
  document.getElementById('btn4').onclick = openTip;
  var noBtn = document.getElementById('tipno');
  var noWaiting = false;
  noBtn.onclick = function(){
    if(noWaiting) return;
    noWaiting = true;
    noBtn.disabled = true;
    setTimeout(function(){
      mask.classList.remove('show');
      noWaiting = false;
      noBtn.disabled = false;
    }, 5000);
  };
  mask.onclick = function(ev){ if(ev.target === mask) mask.classList.remove('show'); };
  setTimeout(openTip, 600);
})();
</script>
<script>
(function(){
  var TOPIC = 'goldmap-fb-3c9a71e5d84b';
  var mask = document.getElementById('fbmask');
  var ta = document.getElementById('fbtext');
  var file = document.getElementById('fbfile');
  var thumb = document.getElementById('fbthumb');
  var fname = document.getElementById('fbname');
  var msg = document.getElementById('fbmsg');
  var send = document.getElementById('fbsend');
  var imgUrl = '';

  function setMsg(t, cls){ msg.textContent = t || ''; msg.className = cls || ''; }

  document.getElementById('fb4').onclick = function(){
    mask.classList.add('show');
    setMsg('');
  };
  document.getElementById('fbcancel').onclick = function(){
    mask.classList.remove('show');
  };
  mask.onclick = function(ev){ if(ev.target === mask) mask.classList.remove('show'); };
  document.getElementById('fbpick').onclick = function(){ file.click(); };

  file.onchange = function(){
    var f = file.files && file.files[0];
    imgUrl = ''; thumb.style.display = 'none'; fname.textContent = '';
    if(!f) return;
    if(f.size > 8*1024*1024){ setMsg('图太大了，8M以内的好上传', 'err'); file.value=''; return; }
    fname.textContent = f.name;
    var fr = new FileReader();
    fr.onload = function(){ thumb.src = fr.result; thumb.style.display = 'block'; };
    fr.readAsDataURL(f);
  };

  function uploadImg(f){
    var fd = new FormData();
    fd.append('reqtype', 'fileupload');
    fd.append('time', '72h');
    fd.append('fileToUpload', f);
    return fetch('https://litterbox.catbox.moe/resources/internals/api.php', {method:'POST', body:fd})
      .then(function(r){ if(!r.ok) throw new Error('图片上传失败 ' + r.status); return r.text(); })
      .then(function(t){
        t = (t||'').trim();
        if(!/^https?:/i.test(t)) throw new Error('图片上传失败');
        return t;
      });
  }

  function pushFeedback(text, url){
    var body = text + (url ? ('\n' + url) : '');
    return fetch('https://ntfy.sh/' + TOPIC, {
      method: 'POST',
      headers: {'Content-Type':'text/plain; charset=utf-8', 'Title':'gold-map feedback'},
      body: body
    }).then(function(r){ if(!r.ok) throw new Error('发送失败 ' + r.status); return true; });
  }

  send.onclick = function(){
    var text = (ta.value || '').trim();
    var f = file.files && file.files[0];
    if(!text && !f){ setMsg('写两句或者选张图呀', 'err'); return; }
    send.disabled = true;
    setMsg(f ? '正在上传图片…' : '正在发送…');
    var step = f ? uploadImg(f).then(function(u){ imgUrl = u; setMsg('正在发送…'); return u; }) : Promise.resolve('');
    step
      .then(function(u){ return pushFeedback(text || '(只有图)', u); })
      .then(function(){
        setMsg('收到啦，谢谢', 'ok');
        ta.value = ''; file.value = ''; thumb.style.display='none'; thumb.src=''; fname.textContent='';
        setTimeout(function(){ mask.classList.remove('show'); setMsg(''); send.disabled = false; }, 1200);
      })
      .catch(function(e){
        setMsg((e && e.message) || '没发出去，再试一次', 'err');
        send.disabled = false;
      });
  };
})();
</script>
<script src="sync.js"></script>
